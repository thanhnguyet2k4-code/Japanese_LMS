<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/InstructorLayout}">
<head>
    <title>Danh sách bài nộp cần chấm - Japanese LMS</title>
</head>
<body>
<section layout:fragment="content" class="lesson-module">
    <header class="page-header">
        <p class="page-subtitle">GIẢNG VIÊN</p>
        <h1 class="page-title">Danh sách bài nộp cần chấm</h1>
    </header>

    <div class="message success" th:if="${message}" th:text="${message}"></div>

    <div class="lesson-toolbar">
        <a class="btn btn-outline" th:href="@{/instructor/grading(status='all')}">Tất cả</a>
        <a class="btn btn-outline" th:href="@{/instructor/grading(status='pending')}">Chưa chấm</a>
        <a class="btn btn-outline" th:href="@{/instructor/grading(status='graded')}">Đã chấm</a>
        <a class="btn btn-outline" th:href="@{/instructor/results}">Kết quả</a>
    </div>

    <div class="card">
        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>Học viên</th>
                    <th>Khóa học</th>
                    <th>Bài tập</th>
                    <th>Nộp lúc</th>
                    <th>Điểm</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${results.content}">
                    <td th:text="${s.student.fullName}"></td>
                    <td th:text="${s.assignment.course.courseName}"></td>
                    <td th:text="${s.assignment.title}"></td>
                    <td th:text="${#temporals.format(s.submittedAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${s.grade == null ? 'Chưa chấm' : s.grade}"></td>
                    <td><a th:href="@{/instructor/grading/{id}(id=${s.submissionId})}">Chấm / sửa điểm</a></td>
                </tr>
                <tr th:if="${results.empty}">
                    <td colspan="6">Chưa có bài nộp.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="lesson-toolbar">
        <a class="btn btn-outline" th:if="${results.hasPrevious()}"
           th:href="@{/instructor/grading(page=${results.number-1},status=${status})}">← Trang trước</a>
        <span th:text="${' Trang ' + (results.number+1) + ' / ' + (results.totalPages == 0 ? 1 : results.totalPages) + ' '}"></span>
        <a class="btn btn-outline" th:if="${results.hasNext()}"
           th:href="@{/instructor/grading(page=${results.number+1},status=${status})}">Trang sau →</a>
    </div>
</section>
</body>
</html>
