<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/StudentLayout}">
<head>
    <title>Điểm và nhận xét của tôi - Japanese LMS</title>
</head>
<body>
<section layout:fragment="content" class="lesson-module">
    <header class="page-header">
        <p class="page-subtitle">HỌC VIÊN</p>
        <h1 class="page-title">Điểm và nhận xét của tôi</h1>
    </header>

    <div class="card">
        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>Khóa học</th>
                    <th>Bài tập</th>
                    <th>Điểm</th>
                    <th>Ngày chấm</th>
                    <th>Chi tiết</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${results.content}">
                    <td th:text="${s.assignment.course.courseName}"></td>
                    <td th:text="${s.assignment.title}"></td>
                    <td th:text="${s.grade}"></td>
                    <td th:text="${s.gradedAt == null ? '-' : #temporals.format(s.gradedAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td><a th:href="@{/student/results/{id}(id=${s.submissionId})}">Xem nhận xét</a></td>
                </tr>
                <tr th:if="${results.empty}">
                    <td colspan="5">Chưa có bài nào được chấm.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="lesson-toolbar">
        <a class="btn btn-outline" th:if="${results.hasPrevious()}"
           th:href="@{/student/grades(page=${results.number-1})}">← Trang trước</a>
        <span th:text="${' Trang ' + (results.number+1) + ' / ' + (results.totalPages == 0 ? 1 : results.totalPages) + ' '}"></span>
        <a class="btn btn-outline" th:if="${results.hasNext()}"
           th:href="@{/student/grades(page=${results.number+1})}">Trang sau →</a>
    </div>
</section>
</body>
</html>
