<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{${resultsLayout}}">
<head>
    <title>Chi tiết kết quả đánh giá - Japanese LMS</title>
</head>
<body>
<section layout:fragment="content" class="lesson-module">
    <header class="page-header">
        <h1 class="page-title">Chi tiết kết quả đánh giá</h1>
    </header>

    <div class="card">
        <p><strong>Học viên:</strong> <span th:text="${submission.student.fullName}"></span></p>
        <p><strong>Khóa học:</strong> <span th:text="${submission.assignment.course.courseName}"></span></p>
        <p><strong>Bài tập:</strong> <span th:text="${submission.assignment.title}"></span></p>
        <p><strong>Thời gian nộp:</strong> <span th:text="${#temporals.format(submission.submittedAt,'dd/MM/yyyy HH:mm')}"></span></p>
        <p><strong>Điểm:</strong> <span th:text="${submission.grade == null ? 'Chưa chấm' : submission.grade}"></span></p>
        <p><strong>Giảng viên chấm:</strong> <span th:text="${submission.gradedBy == null ? '-' : submission.gradedBy.fullName}"></span></p>
        <p><strong>Ngày chấm:</strong> <span th:text="${submission.gradedAt == null ? '-' : #temporals.format(submission.gradedAt,'dd/MM/yyyy HH:mm')}"></span></p>

        <h3>Nhận xét</h3>
        <pre style="white-space: pre-wrap; overflow-wrap: anywhere; font-family: inherit;"
             th:text="${submission.feedback == null || submission.feedback.isBlank() ? 'Chưa có nhận xét' : submission.feedback}"></pre>
    </div>

    <div class="lesson-toolbar">
        <a class="btn btn-outline" th:href="@{/student/grades}" sec:authorize="hasRole('STUDENT')">Quay lại</a>
        <a class="btn btn-outline" th:href="@{/instructor/results}" sec:authorize="hasRole('INSTRUCTOR')">Quay lại</a>
        <a class="btn btn-outline" th:href="@{/admin/results}" sec:authorize="hasRole('ADMIN')">Quay lại</a>
    </div>
</section>
</body>
</html>
