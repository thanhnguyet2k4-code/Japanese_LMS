<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Japanese LMS - MF05</title><link rel="stylesheet" th:href="@{/css/style.css}"><style>body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172238}main{max-width:1050px;margin:32px auto;padding:24px;background:white;border-radius:12px}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #ddd;text-align:left;padding:12px}a{color:#1658a8}input,textarea,button,select{padding:9px;margin:5px 0}input,textarea{max-width:100%;box-sizing:border-box}button,.action{background:#1959ad;color:white;border:0;border-radius:5px;padding:9px 14px;cursor:pointer;text-decoration:none}.error{color:#b42318}.ok{color:green}.pagination{margin:18px 0} .muted{color:#667085}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><main><h1>S20 - Chấm điểm và phản hồi</h1><p><strong>Học viên:</strong> <span th:text="${submission.student.fullName}"></span></p><p><strong>Khóa học:</strong> <span th:text="${submission.assignment.course.courseName}"></span></p><p><strong>Bài tập:</strong> <span th:text="${submission.assignment.title}"></span></p><p><strong>Ngày nộp:</strong> <span th:text="${#temporals.format(submission.submittedAt, 'dd/MM/yyyy HH:mm')}"></span></p><h3>Nội dung bài nộp</h3><pre th:text="${submission.responseText == null ? '(Không có văn bản)' : submission.responseText}"></pre><p th:if="${submission.originalFileName != null}">Tệp đính kèm: <span th:text="${submission.originalFileName}"></span> <span class="muted">(Tải tệp qua module nộp bài MF-04 sau khi tích hợp)</span></p><form method="post" th:action="@{/instructor/grading/{id}(id=${submission.submissionId})}" th:object="${gradeForm}"><label for="grade">Điểm (0–10):</label><br><input id="grade" type="number" min="0" max="10" step="0.1" required th:field="*{grade}"><div class="error" th:if="${#fields.hasErrors('grade')}" th:errors="*{grade}"></div><br><label for="feedback">Nhận xét:</label><br><textarea id="feedback" rows="5" cols="65" maxlength="2000" th:field="*{feedback}"></textarea><div class="error" th:if="${#fields.hasErrors('feedback')}" th:errors="*{feedback}"></div><br><button type="submit">Lưu điểm và phản hồi</button> <a th:href="@{/instructor/grading}">Quay lại</a></form></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
