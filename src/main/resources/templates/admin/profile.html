<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/AdminLayout}">
<head>
    <title>Hồ sơ cá nhân - Japanese LMS</title>
</head>

<body class="admin-layout-page profile-page">

<div layout:fragment="content">
    <div class="breadcrumb" style="margin-bottom: 20px; color: #64748b; font-size: 14px;">
        <a th:href="@{/admin}" style="color: #2563eb; text-decoration: none;">Trang quản trị</a>
        / Hồ sơ cá nhân
    </div>

    <h1>Hồ sơ cá nhân</h1>
    <p class="subtitle">
        Xem và cập nhật thông tin tài khoản Quản trị viên Japanese LMS.
    </p>

    <!-- Thong bao thanh cong -->
    <div class="message success"
         th:if="${successMessage != null}"
         th:text="${successMessage}">
    </div>

    <!-- Thong bao that bai -->
    <div class="message error"
         th:if="${errorMessage != null}"
         th:text="${errorMessage}">
    </div>

    <!-- Thong tin ca nhan -->
    <section class="card">
        <h2>Thông tin cá nhân</h2>


        <form th:action="@{/profile}" method="post"
              th:object="${profileForm}" novalidate>

            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="field">
                <label for="fullName">Họ và tên</label>
                <input id="fullName"
                       type="text"
                       th:field="*{fullName}"
                       maxlength="100"
                       th:classappend="${#fields.hasErrors('fullName')} ? ' is-invalid'">

                <small class="invalid-feedback"
                       th:if="${#fields.hasErrors('fullName')}"
                       th:errors="*{fullName}"></small>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input id="email"
                       type="email"
                       readonly
                       th:value="${user.email}">
            </div>

            <div class="field">
                <label for="phone">Số điện thoại</label>
                <input id="phone"
                       type="text"
                       th:field="*{phone}"
                       maxlength="20"
                       th:classappend="${#fields.hasErrors('phone')} ? ' is-invalid'">

                <small class="invalid-feedback"
                       th:if="${#fields.hasErrors('phone')}"
                       th:errors="*{phone}"></small>
            </div>

            <div class="field">
                <label>Vai trò</label>
                <input type="text"
                       readonly
                       th:value="${user.role}">
            </div>

            <button type="submit">Lưu thay đổi</button>
        </form>

    </section>

    <!-- Doi mat khau -->
    <section class="card">
        <h2>Đổi mật khẩu</h2>


        <form th:action="@{/profile/change-password}"
              method="post"
              th:object="${passwordForm}"
              novalidate>

            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="field">
                <label for="currentPassword">Mật khẩu hiện tại</label>
                <input id="currentPassword"
                       type="password"
                       th:field="*{currentPassword}"
                       autocomplete="current-password"
                       th:classappend="${#fields.hasErrors('currentPassword')} ? ' is-invalid'">

                <small class="invalid-feedback"
                       th:if="${#fields.hasErrors('currentPassword')}"
                       th:errors="*{currentPassword}"></small>
            </div>

            <div class="field">
                <label for="newPassword">Mật khẩu mới</label>
                <input id="newPassword"
                       type="password"
                       th:field="*{newPassword}"
                       minlength="8"
                       autocomplete="new-password"
                       th:classappend="${#fields.hasErrors('newPassword')} ? ' is-invalid'">

                <small class="invalid-feedback"
                       th:if="${#fields.hasErrors('newPassword')}"
                       th:errors="*{newPassword}"></small>
            </div>

            <div class="field">
                <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                <input id="confirmPassword"
                       type="password"
                       th:field="*{confirmPassword}"
                       minlength="8"
                       autocomplete="new-password"
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? ' is-invalid'">

                <small class="invalid-feedback"
                       th:if="${#fields.hasErrors('confirmPassword')}"
                       th:errors="*{confirmPassword}"></small>
            </div>

            <button type="submit">Đổi mật khẩu</button>
        </form>

    </section>
</div>

</body>
</html>
