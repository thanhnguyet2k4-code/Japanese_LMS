<!DOCTYPE html>
<!--
    S06 – Course List (UC06)   |   GET /courses
    Model: courses (Page<CourseSummaryDto>), keyword, level, sort, levels, currentPage, totalPages, totalElements, pageSize
    Hiển thị dạng lưới 3 cột, 9 khóa học / trang; có tìm kiếm, lọc cấp độ, sắp xếp và phân trang.
-->
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/MainLayout}">
<head>
    <title>Danh sách khóa học - Japanese LMS</title>

    <th:block layout:fragment="head">
        <!-- CSS riêng của module Course (chỉ có hiệu lực trong .course-page) -->
        <link rel="stylesheet" th:href="@{/css/course.css}">
    </th:block>
</head>
<body>

<section layout:fragment="content" class="list-page course-page">

    <header class="page-header">
        <h1 class="page-title">Khóa học tiếng Nhật</h1>
        <p class="page-subtitle">Tìm khóa học phù hợp với cấp độ JLPT của bạn.</p>
    </header>

    <!-- Thông báo (flash) từ redirect, ví dụ: đăng ký thất bại vì khóa học đã ngừng hoạt động -->
    <div class="alert alert-success" th:if="${successMessage != null}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

    <!-- Bộ lọc: gửi bằng GET để có thể bookmark / chia sẻ liên kết (BR4) -->
    <section class="card" style="margin-bottom: 22px;">
        <form class="list-toolbar" style="margin-bottom: 0;" th:action="@{/courses}" method="get" role="search">

            <div class="form-group grow">
                <label class="form-label" for="keyword">Tìm theo tên khóa học</label>
                <input id="keyword" type="search" name="keyword"
                       maxlength="100"
                       placeholder="Ví dụ: Minna no Nihongo"
                       th:value="${keyword}">
            </div>

            <div class="form-group">
                <label class="form-label" for="level">Cấp độ JLPT</label>
                <select id="level" name="level">
                    <option value="">Tất cả cấp độ</option>
                    <option th:each="lv : ${levels}"
                            th:value="${lv.name()}"
                            th:text="${lv.name()}"
                            th:selected="${lv.name() == level}">N5
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="sort">Sắp xếp</label>
                <select id="sort" name="sort">
                    <option value="createdAt,desc" th:selected="${sort == 'createdAt,desc'}">Mới nhất</option>
                    <option value="createdAt,asc" th:selected="${sort == 'createdAt,asc'}">Cũ nhất</option>
                    <option value="courseName,asc" th:selected="${sort == 'courseName,asc'}">Tên A → Z</option>
                    <option value="courseName,desc" th:selected="${sort == 'courseName,desc'}">Tên Z → A</option>
                </select>
            </div>

            <div class="toolbar-actions">
                <button type="submit" class="btn btn-primary">Tìm kiếm</button>
                <a th:href="@{/courses}" class="btn btn-outline">Đặt lại</a>
            </div>
        </form>
    </section>

    <p class="list-summary">
        Tìm thấy <strong th:text="${totalElements}">0</strong> khóa học
    </p>

    <!-- Lưới thẻ khóa học -->
    <section class="course-tile-grid" th:if="${!courses.isEmpty()}">
        <article class="card lesson-course-card course-tile" th:each="c : ${courses.content}">

            <div th:replace="~{fragments/list-controls :: cover(${c.hasCover}, ${c.courseId}, ${c.coverVersion}, ${c.courseName})}"></div>

            <div class="course-tile-head">
                <span class="level-badge" th:text="${c.jlptLevel}">N5</span>
            </div>

            <h2>
                <a th:href="@{/courses/{id}(id=${c.courseId})}" th:text="${c.courseName}">Tên khóa học</a>
            </h2>

            <p class="muted">
                Giảng viên: <strong th:text="${c.instructorName}">Giảng viên</strong>
            </p>

            <p class="course-tile-desc"
               th:text="${c.description != null ? #strings.abbreviate(c.description, 100) : 'Chưa có mô tả.'}">
                Mô tả ngắn của khóa học...
            </p>

            <div class="course-tile-actions">
                <a th:href="@{/courses/{id}(id=${c.courseId})}" class="btn btn-primary">Xem chi tiết</a>
            </div>
        </article>
    </section>

    <!-- Không có kết quả -->
    <section class="card empty-state" th:if="${courses.isEmpty()}">
        <!-- Trang vượt quá tổng số trang (E3): có dữ liệu nhưng trang này rỗng -> về trang đầu -->
        <p th:if="${totalElements > 0}">Trang này không có dữ liệu.</p>
        <p th:if="${totalElements == 0}">Không tìm thấy khóa học phù hợp. Hãy thử từ khóa hoặc cấp độ khác.</p>
        <a th:href="@{/courses(keyword=${keyword},level=${level},sort=${sort},page=0)}"
           class="btn btn-outline">Về trang đầu</a>
    </section>

    <!-- Phân trang: giữ nguyên keyword / level / sort khi chuyển trang (BR5) -->
    <th:block th:replace="~{fragments/list-controls :: pager('/courses')}"></th:block>
</section>

</body>
</html>
