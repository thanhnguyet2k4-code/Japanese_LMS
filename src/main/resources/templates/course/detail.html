<!DOCTYPE html>
<!--
    S07 – Course Details (UC07 + nút đăng ký của UC09)   |   GET /courses/{id}
    Model: course (CourseDetailDto), enrolled (boolean)
-->
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/MainLayout}">
<head>
    <title th:text="${course.courseName} + ' - Japanese LMS'">Chi tiết khóa học - Japanese LMS</title>

    <th:block layout:fragment="head">
        <!-- CSS riêng của module Course (chỉ có hiệu lực trong .course-page) -->
        <link rel="stylesheet" th:href="@{/css/course.css}">
    </th:block>
</head>
<body>

<section layout:fragment="content" class="course-page">


    <!-- Thông báo flash: đăng ký thất bại / đã đăng ký -->
    <div class="alert alert-success" th:if="${successMessage != null}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

    <p>
        <!-- A2: quay lại đúng trang/bộ lọc trước đó nếu người dùng đến từ danh sách -->
        <a th:href="@{/courses}" id="backToList">← Quay lại danh sách</a>
    </p>

    <div class="detail-layout">

        <!-- Cột trái: thông tin khóa học -->
        <section class="card">
            <img class="course-cover course-detail-cover"
                 th:if="${course.hasCover}"
                 th:src="@{/files/course-images/{id}(id=${course.courseId}, v=${course.coverVersion})}"
                 th:alt="${course.courseName}">

            <span class="badge"
                  th:classappend="${'badge-' + #strings.toLowerCase(course.jlptLevel)}"
                  th:text="${course.jlptLevel}">N5</span>

            <h1 class="detail-title" th:text="${course.courseName}">Tên khóa học</h1>

            <h2 class="card-title">Mô tả khóa học</h2>
            <!-- th:text (không phải th:utext) để chống XSS; CSS pre-line giữ các dòng xuống hàng -->
            <p class="detail-description"
               th:text="${course.description != null and !#strings.isEmpty(course.description)
                          ? course.description : 'Chưa có mô tả.'}">
                Nội dung mô tả...
            </p>
        </section>

        <!-- Cột phải: thông tin nhanh + nút hành động theo quyền -->
        <aside class="card">
            <h2 class="card-title">Thông tin khóa học</h2>

            <ul class="info-list">
                <li><span>Cấp độ</span><strong th:text="${course.jlptLevel}">N5</strong></li>
                <li><span>Giảng viên</span><strong th:text="${course.instructorName}">Giảng viên</strong></li>
                <li><span>Số bài học</span><strong th:text="${course.lessonCount}">0</strong></li>
                <li><span>Ngày tạo</span>
                    <strong th:text="${#temporals.format(course.createdAt, 'dd/MM/yyyy')}">01/01/2026</strong></li>
            </ul>

            <div class="action-stack">

                <!-- 1) Guest -> chuyển đến trang đăng nhập -->
                <a sec:authorize="isAnonymous()"
                   th:href="@{/login}"
                   class="btn btn-primary btn-block">Đăng nhập để đăng ký</a>

                <!-- 2) Student -->
                <div sec:authorize="hasRole('STUDENT')">

                    <!-- 2a) Chưa đăng ký: form POST. th:action tự thêm CSRF token -->
                    <form th:if="${!enrolled}"
                          th:action="@{/courses/{id}/enroll(id=${course.courseId})}"
                          method="post">
                        <button type="submit" class="btn btn-primary btn-block">Đăng ký khóa học</button>
                    </form>

                    <!-- 2b) Đã đăng ký: nhãn + nút vào học.
                         LƯU Ý: URL danh sách bài học thuộc MF-03 (Member 3) - đổi cho khớp khi họ chốt -->
                    <div th:if="${enrolled}">
                        <p class="enrolled-label">✔ Đã đăng ký</p>
                        <a th:href="@{/student/courses/{id}/lessons(id=${course.courseId})}"
                           class="btn btn-accent btn-block">Vào học</a>
                    </div>
                </div>

                <!-- 3) Instructor / Admin: chỉ xem, không đăng ký -->
                <p sec:authorize="hasAnyRole('INSTRUCTOR','ADMIN')" class="form-help">
                    Chỉ tài khoản học viên mới có thể đăng ký khóa học.
                </p>
            </div>
        </aside>
    </div>

    <script>
        // A2 (UC07): nếu đến từ danh sách khóa học thì quay lại đúng trang + bộ lọc trước đó
        document.getElementById('backToList').addEventListener('click', function (event) {
            if (document.referrer) {
                var from = new URL(document.referrer).pathname;
                if (from === new URL(this.href).pathname) {
                    event.preventDefault();
                    history.back();
                }
            }
        });
    </script>
</section>

</body>
</html>
