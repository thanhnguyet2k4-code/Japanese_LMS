<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Khóa học của tôi - Japanese LMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container page-shell">
    <div class="page-header">
        <div>
            <h1>Khóa học của tôi</h1>
            <p class="muted">Danh sách các khóa học tiếng Nhật bạn đã đăng ký tham gia</p>
        </div>
        <a class="btn btn-outline" th:href="@{/courses}">+ Đăng ký thêm khóa học</a>
    </div>

    <div th:if="${successMessage}" class="alert success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}"></div>

    <div th:if="${enrollments.isEmpty()}" class="card" style="text-align: center; padding: 40px 20px;">
        <h3>Bạn chưa đăng ký khóa học nào</h3>
        <p class="muted">Hãy khám phá danh mục khóa học N5, N4, N3 để bắt đầu lộ trình học tập của mình.</p>
        <a class="btn" th:href="@{/courses}">Khám phá khóa học</a>
    </div>

    <div th:if="${!enrollments.isEmpty()}" class="dashboard-grid">
        <div class="card" th:each="item : ${enrollments.content}"
             style="display: flex; flex-direction: column; justify-content: space-between;">
            <div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span class="badge APPROVED" th:text="'JLPT ' + ${item.jlptLevel()}"></span>
                    <span class="badge"
                          th:classappend="${item.courseStatus() == 'ACTIVE'} ? 'ACTIVE' : 'INACTIVE'"
                          th:text="${item.courseStatus() == 'ACTIVE'} ? 'Đang mở' : 'Ngừng hoạt động'"></span>
                </div>
                <h3 style="margin: 8px 0;" th:text="${item.courseName()}"></h3>
                <p class="muted" style="font-size: 14px;">
                    Giảng viên: <strong th:text="${item.instructorName()}"></strong>
                </p>
                <p style="font-size: 14px; color: #334155; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;"
                   th:text="${item.description()}"></p>
            </div>

            <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
                <span class="muted" style="font-size: 12px;"
                      th:text="'Ngày đăng ký: ' + ${#temporals.format(item.enrolledAt(), 'dd/MM/yyyy HH:mm')}"></span>
                <div style="display: flex; gap: 6px;">
                    <a class="btn btn-secondary btn-sm" th:href="@{/courses/{id}(id=${item.courseId()})}">Chi tiết</a>
                    <!-- Liên kết sang màn hình S10 của Member 3 -->
                    <a class="btn btn-sm" th:href="@{/courses/{id}/lessons(id=${item.courseId()})}">Vào học</a>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${totalPages > 1}" style="display: flex; justify-content: center; gap: 8px; margin-top: 24px;">
        <a class="btn btn-secondary btn-sm" th:if="${currentPage > 0}"
           th:href="@{/my-courses(page=${currentPage - 1})}">‹ Trước</a>
        <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
           th:href="@{/my-courses(page=${i})}"
           th:text="${i + 1}"
           th:class="${i == currentPage} ? 'btn btn-sm' : 'btn btn-secondary btn-sm'"></a>
        <a class="btn btn-secondary btn-sm" th:if="${currentPage + 1 < totalPages}"
           th:href="@{/my-courses(page=${currentPage + 1})}">Sau ›</a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
