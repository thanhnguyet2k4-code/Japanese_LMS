<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="navbar" class="site-navbar">

    <!-- Topbar riêng cho Quản trị viên (Admin Topbar) -->
    <div sec:authorize="hasRole('ADMIN')" class="admin-topbar">
        <div class="admin-topbar-left">
            <button type="button"
                    class="admin-icon-btn"
                    id="adminSidebarToggle"
                    aria-label="Ẩn hoặc hiện thanh điều hướng"
                    aria-controls="adminSidebar"
                    aria-expanded="true">
                <span aria-hidden="true">☰</span>
            </button>

            <!-- Searchbar tối ưu định hướng phạm vi tìm kiếm theo Nguyên tắc 3 (Frictionless UX) -->
            <form class="admin-search"
                  th:action="@{/admin/accounts}"
                  method="get"
                  role="search">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input type="search"
                       name="keyword"
                       placeholder="Tìm kiếm tài khoản, khóa học, bài nộp..."
                       aria-label="Tìm kiếm quản trị">
                <kbd class="search-kbd" title="Phím tắt tìm kiếm: Ctrl + K">Ctrl K</kbd>
            </form>
        </div>

        <div class="admin-topbar-right">
            <!-- Nút liên kết phụ về Trang chủ người dùng - Nguyên tắc 1 (Visual Hierarchy) -->
            <a th:href="@{/}"
               class="admin-portal-link"
               title="Chuyển sang giao diện người dùng"
               aria-label="Chuyển sang giao diện người dùng">
                <span aria-hidden="true">⌂</span>
                <span class="portal-label">Trang chủ</span>
            </a>

            <!-- Biểu tượng thông báo kèm Badge số lượng chưa đọc - Nguyên tắc 4 (Direct Feedback) -->
            <div class="notification-container">
                <a th:href="@{/admin/registrations}"
                   class="admin-icon-btn notification-btn"
                   aria-label="Xem thông báo hệ thống"
                   title="Xem thông báo hệ thống">
                    <span aria-hidden="true">🔔</span>
                    <!-- Chỉ hiển thị Badge khi có thông báo (> 0), ngược lại ẩn hoàn toàn -->
                    <span th:if="${unreadNotificationsCount != null and unreadNotificationsCount > 0}"
                          class="notification-badge"
                          th:text="${unreadNotificationsCount > 99 ? '99+' : unreadNotificationsCount}">
                        1
                    </span>
                </a>
            </div>

            <!-- Menu tài khoản Admin -->
            <details class="admin-account">
                <summary aria-label="Mở menu tài khoản Admin">
                    <span class="admin-avatar" aria-hidden="true">A</span>
                    <span class="admin-account-label" sec:authentication="name">Admin</span>
                    <span class="admin-chevron" aria-hidden="true">▾</span>
                </summary>

                <div class="admin-account-menu">
                    <div class="account-menu-header">
                        <span class="account-role-tag">Quản trị viên</span>
                    </div>

                    <a th:href="@{/profile}">
                        <span aria-hidden="true">👤</span> Hồ sơ cá nhân
                    </a>

                    <a th:href="@{/admin/accounts}">
                        <span aria-hidden="true">👥</span> Quản lý tài khoản
                    </a>

                    <form th:action="@{/logout}" method="post">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">
                        <button type="submit">
                            <span aria-hidden="true">🚪</span> Đăng xuất
                        </button>
                    </form>
                </div>
            </details>
        </div>
    </div>

    <!-- Navbar dành cho người dùng thông thường (Student / Instructor / Anonymous) -->
    <div sec:authorize="!hasRole('ADMIN')" class="navbar-inner">

        <a th:href="@{/}" class="brand">
            <span class="brand-mark">日</span>
            <span>Japanese LMS</span>
        </a>

        <div class="nav-links">
            <a th:href="@{/}" class="nav-link">Trang chủ</a>

            <a sec:authorize="hasRole('INSTRUCTOR')"
               th:href="@{/}"
               class="nav-link">Giảng viên</a>

            <a sec:authorize="hasRole('STUDENT')"
               th:href="@{/}"
               class="nav-link">Học viên</a>

            <a sec:authorize="isAuthenticated()"
               th:href="@{/profile}"
               class="nav-link">Hồ sơ cá nhân</a>
        </div>

        <div class="nav-actions">
            <form sec:authorize="isAuthenticated()"
                  th:action="@{/logout}"
                  method="post">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline">
                    Đăng xuất
                </button>
            </form>

            <a sec:authorize="isAnonymous()"
               th:href="@{/login}"
               class="btn btn-primary">Đăng nhập</a>
        </div>
    </div>

</nav>

</body>
</html>
