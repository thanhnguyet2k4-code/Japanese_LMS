
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản Học viên | Japanese LMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="register-page">
<div class="scene">
    <div class="flower one" aria-hidden="true"></div>
    <div class="flower two" aria-hidden="true"></div>
    <div class="flower three" aria-hidden="true"></div>

    <main class="registration-card">
        <header class="header">
            <div class="logo" aria-hidden="true">
                <svg width="48" height="43" viewBox="0 0 48 43"
                     fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 34 20 8l8 13 4-6 12 19H4Z"
                          fill="#087F77"/>
                    <path d="m15 16 5-8 8 13 4-6 5 8-5-3-5 4-7-8-5 4Z"
                          fill="white"/>
                    <circle cx="36" cy="8" r="3" fill="#E6A0A7"/>
                    <circle cx="41" cy="10" r="3" fill="#F2B7BB"/>
                    <circle cx="38" cy="14" r="3" fill="#E6A0A7"/>
                    <circle cx="34" cy="13" r="3" fill="#F2B7BB"/>
                </svg>
            </div>

            <p class="brand-name">にほんご JAPANESE LMS</p>
            <h1>Đăng ký tài khoản Học viên</h1>
            <p class="subtitle">
                Đăng ký để bắt đầu hành trình học tiếng Nhật
            </p>
        </header>

        <form class="register-form"
              th:action="@{/register}"
              th:object="${registerRequest}"
              method="post">


            <!-- Hien thi loi nghiep vu chung, vi du email da duoc su dung -->
            <div th:if="${#fields.hasGlobalErrors()}"
                 class="server-error"
                 role="alert">
                <p th:each="err : ${#fields.globalErrors()}"
                   th:text="${err}">
                </p>
            </div>

            <!-- Hien thi thong bao thanh cong neu co -->
            <div th:if="${successMessage}"
                 class="server-error"
                 role="status"
                 th:text="${successMessage}">
            </div>


            <!-- Ho va ten -->
            <div class="field">
                <label class="field-label" for="fullName">
                    Họ và tên <span class="required">*</span>
                </label>

                <div class="input-shell"
                     th:classappend="${#fields.hasErrors('fullName')} ? 'invalid' : ''">
                    <svg class="field-icon" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor"
                         stroke-width="1.8" aria-hidden="true">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
                    </svg>

                    <input id="fullName"
                           type="text"
                           th:field="*{fullName}"
                           placeholder="Nguyễn Minh Anh"
                           maxlength="100"
                           autocomplete="name"
                           required
                           th:attr="aria-invalid=${#fields.hasErrors('fullName')}">
                </div>

                <p class="error-line"
                   th:if="${#fields.hasErrors('fullName')}"
                   th:errors="*{fullName}"></p>
            </div>

            <!-- Email -->
            <div class="field">
                <label class="field-label" for="email">
                    Email <span class="required">*</span>
                </label>

                <div class="input-shell"
                     th:classappend="${#fields.hasErrors('email')} ? 'invalid' : ''">
                    <svg class="field-icon" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor"
                         stroke-width="1.8" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <path d="m3 7 9 6 9-6"/>
                    </svg>

                    <input id="email"
                           type="email"
                           th:field="*{email}"
                           placeholder="ban@example.com"
                           maxlength="255"
                           autocomplete="email"
                           required
                           th:attr="aria-invalid=${#fields.hasErrors('email')}">
                </div>

                <p class="error-line"
                   th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}"></p>
            </div>

            <!-- So dien thoai -->
            <div class="field">
                <label class="field-label" for="phoneNumber">
                    Số điện thoại <span class="required">*</span>
                </label>

                <div class="input-shell"
                     th:classappend="${#fields.hasErrors('phoneNumber')} ? 'invalid' : ''">
                    <svg class="field-icon" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor"
                         stroke-width="1.8" aria-hidden="true">
                        <path d="M5 3h4l2 5-3 2a15 15 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2Z"/>
                    </svg>

                    <input id="phoneNumber"
                           type="tel"
                           th:field="*{phoneNumber}"
                           placeholder="0912345678"
                           maxlength="13"
                           autocomplete="tel"
                           required
                           th:attr="aria-invalid=${#fields.hasErrors('phoneNumber')}">
                </div>

                <p class="error-line"
                   th:if="${#fields.hasErrors('phoneNumber')}"
                   th:errors="*{phoneNumber}"></p>
            </div>

            <!-- Mat khau -->
            <div class="field">
                <label class="field-label" for="password">
                    Mật khẩu <span class="required">*</span>
                </label>

                <div class="input-shell"
                     th:classappend="${#fields.hasErrors('password')} ? 'invalid' : ''">
                    <svg class="field-icon" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor"
                         stroke-width="1.8" aria-hidden="true">
                        <rect x="4" y="10" width="16" height="11" rx="2"/>
                        <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                    </svg>

                    <input id="password"
                           type="password"
                           th:field="*{password}"
                           placeholder="Nhập mật khẩu"
                           minlength="8"
                           maxlength="72"
                           autocomplete="new-password"
                           required
                           th:attr="aria-invalid=${#fields.hasErrors('password')}">

                    <button class="toggle-password"
                            type="button"
                            data-target="password"
                            aria-label="Hiện mật khẩu"
                            aria-pressed="false">
                        <svg viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round"
                             aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>

                <p class="error-line"
                   th:if="${#fields.hasErrors('password')}"
                   th:errors="*{password}"></p>
            </div>

            <!-- Xac nhan mat khau -->
            <div class="field">
                <label class="field-label" for="confirmPassword">
                    Xác nhận mật khẩu <span class="required">*</span>
                </label>

                <div class="input-shell"
                     th:classappend="${#fields.hasErrors('confirmPassword')} ? 'invalid' : ''">
                    <svg class="field-icon" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor"
                         stroke-width="1.8" aria-hidden="true">
                        <rect x="4" y="10" width="16" height="11" rx="2"/>
                        <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                    </svg>

                    <input id="confirmPassword"
                           type="password"
                           th:field="*{confirmPassword}"
                           placeholder="Nhập lại mật khẩu"
                           maxlength="72"
                           autocomplete="new-password"
                           required
                           th:attr="aria-invalid=${#fields.hasErrors('confirmPassword')}">

                    <button class="toggle-password"
                            type="button"
                            data-target="confirmPassword"
                            aria-label="Hiện mật khẩu xác nhận"
                            aria-pressed="false">
                        <svg viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round"
                             aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>

                <p class="error-line"
                   th:if="${#fields.hasErrors('confirmPassword')}"
                   th:errors="*{confirmPassword}"></p>
            </div>

            <button class="submit-button" type="submit">
                ĐĂNG KÝ TÀI KHOẢN
            </button>
        </form>

        <footer class="footer">
            <p>
                Bạn đã có tài khoản?
                <a th:href="@{/login}">Đăng nhập ngay</a>
            </p>
        </footer>
    </main>
</div>

<script>
    // Hien hoac an mat khau khi nhan icon con mat
    document.querySelectorAll(".toggle-password").forEach(button => {
        button.addEventListener("click", () => {
            const input = document.getElementById(button.dataset.target);
            const isHidden = input.type === "password";

            input.type = isHidden ? "text" : "password";
            button.setAttribute("aria-pressed", String(isHidden));
            button.setAttribute(
                "aria-label",
                isHidden ? "Ẩn mật khẩu" : "Hiện mật khẩu"
            );
        });
    });
</script>
</body>
</html>
