server.port=8080

spring.application.name=japanese-lms

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=japanese_lms;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Cấu hình lưu trữ tệp bài nộp ngoài thư mục static (Bảo mật UUID)
app.upload.dir=uploads/submissions
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
