
server.port=8080

spring.application.name=japanese-lms

# SQL Server
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=japanese_lms;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa

# JPA / Hibernate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.cache=false

# Submission upload
app.upload.dir=uploads/submissions

# Materials and course images upload
app.upload.materials-dir=uploads/materials
app.upload.course-images-dir=uploads/course-images

# Multipart upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
